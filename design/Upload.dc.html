<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>행정누리 자료 올리기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'MDotum';src:url('/_blob/3df0dad862d67c0e08fd381254d1931c') format('truetype');font-weight:400 800;font-display:swap}
body{margin:0;background:#F3F5F8}
a{color:#1D4E89}a:hover{color:#123A6B}
</style>
</helmet>
<div style="font-family: 'MDotum', system-ui, sans-serif; color: #18212E; background: #F3F5F8; min-height: 100vh;">

  <!-- 상단 헤더 -->
  <header style="background: {{brand}}; color: #FFFFFF;">
    <div style="max-width: 1360px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px;">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; color: #FFFFFF; text-decoration: none;">
        <div style="width: 40px; height: 40px; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; justify-content: center;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{brand}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l9-6 9 6"></path><path d="M5 10v9h14v-9"></path><path d="M10 19v-5h4v5"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column;">
          <span style="font-size: 28px; font-weight: 800; letter-spacing: -0.5px;">행정누리</span>
          <span style="font-size: 15px; color: #C9D8EC;">통합 행정업무 시스템</span>
        </div>
      </a>
      <nav aria-label="주 메뉴" style="display: flex; flex-wrap: wrap; gap: 4px; flex: 1 1 420px;">
        <a href="Main.dc.html" style="color: #E3ECF7; text-decoration: none; padding: 10px 14px; border-radius: 8px; font-size: 19px;">홈</a>
        <a href="Approval.dc.html" style="color: #E3ECF7; text-decoration: none; padding: 10px 14px; border-radius: 8px; font-size: 19px;">전자결재</a>
        <a href="Civil.dc.html" style="color: #E3ECF7; text-decoration: none; padding: 10px 14px; border-radius: 8px; font-size: 19px;">민원</a>
        <a href="Finance.dc.html" style="color: #E3ECF7; text-decoration: none; padding: 10px 14px; border-radius: 8px; font-size: 19px;">재정·세무</a>
        <a href="Hr.dc.html" style="color: #E3ECF7; text-decoration: none; padding: 10px 14px; border-radius: 8px; font-size: 19px;">인사</a>
        <a href="Board.dc.html" aria-current="page" style="color: #FFFFFF; text-decoration: none; padding: 10px 14px; border-radius: 8px; background: rgba(255,255,255,0.14); font-weight: 700; font-size: 19px;">게시판</a>
      </nav>
      <div style="display: flex; align-items: center; gap: 10px; padding: 4px 12px 4px 4px; border-radius: 999px; background: rgba(255,255,255,0.12);">
        <div style="width: 36px; height: 36px; border-radius: 999px; background: #FFFFFF; color: {{brand}}; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 18px;">홍</div>
        <div style="display: flex; flex-direction: column; line-height: 1.3;">
          <span style="font-size: 18px; font-weight: 700;">[사용자명] 주무관</span>
          <span style="font-size: 15px; color: #C9D8EC;">[소속 부서]</span>
        </div>
      </div>
    </div>
  </header>

  <main style="max-width: 1100px; margin: 0 auto; padding: 28px 24px 48px; display: flex; flex-direction: column; gap: 20px;">

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 17px; color: #5B6779;"><a href="Board.dc.html" style="color: #5B6779;">게시판</a> › 자료실 › 자료 올리기</span>
      <h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.5px;">자료 올리기</h1>
    </div>

    <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
      <div role="status" style="background: #E3F3E8; border: 1px solid #A9D8B6; color: #1C6B35; border-radius: 12px; padding: 16px 20px; font-size: 19px; font-weight: 700;">자료가 등록되었습니다.</div>
    </sc-if>

    <form style="background: #FFFFFF; border: 1px solid #DDE3EB; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 22px;">

      <!-- 파일 선택 영역 -->
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 19px; font-weight: 700;">파일 <span style="color: #A12626;">*</span></span>
        <label for="uf" style="border: 2px dashed #A9B5C4; border-radius: 16px; background: #F8FAFC; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; cursor: pointer; text-align: center;">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="{{brand}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"></path><path d="M7 9l5-5 5 5"></path><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"></path></svg>
          <span style="font-size: 21px; font-weight: 700;">파일을 여기로 끌어오거나 눌러서 선택하세요</span>
          <span style="font-size: 17px; color: #4A5668;">한 번에 여러 개 선택할 수 있습니다 · 허용 형식·용량: [기준]</span>
          <span style="display: inline-flex; align-items: center; height: 48px; padding: 0 22px; border: 2px solid {{brand}}; border-radius: 12px; background: #FFFFFF; color: {{brand}}; font-size: 19px; font-weight: 700;">파일 선택</span>
        </label>
        <input id="uf" type="file" multiple style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 20px;">
        <div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 8px;">
          <label for="ucat" style="font-size: 19px; font-weight: 700;">분류</label>
          <select id="ucat" style="height: 56px; padding: 0 14px; font-size: 19px; font-family: inherit; border: 2px solid #C5CFDC; border-radius: 12px; background: #FFFFFF; color: #18212E;">
            <option>업무 서식</option>
            <option>지침·매뉴얼</option>
            <option>교육 자료</option>
            <option>기타</option>
          </select>
        </div>
        <div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 8px;">
          <label for="uscope" style="font-size: 19px; font-weight: 700;">공개 범위</label>
          <select id="uscope" style="height: 56px; padding: 0 14px; font-size: 19px; font-family: inherit; border: 2px solid #C5CFDC; border-radius: 12px; background: #FFFFFF; color: #18212E;">
            <option>전체 공개</option>
            <option>우리 부서</option>
          </select>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label for="ut" style="font-size: 19px; font-weight: 700;">자료 제목 <span style="color: #A12626;">*</span></label>
        <input id="ut" type="text" required placeholder="자료 제목을 입력하세요" style="height: 56px; padding: 0 16px; font-size: 19px; font-family: inherit; border: 2px solid #C5CFDC; border-radius: 12px; color: #18212E;">
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label for="ud" style="font-size: 19px; font-weight: 700;">설명</label>
        <textarea id="ud" rows="5" placeholder="자료에 대한 간단한 설명을 입력하세요" style="padding: 14px 16px; font-size: 19px; line-height: 1.6; font-family: inherit; border: 2px solid #C5CFDC; border-radius: 12px; color: #18212E; resize: vertical;"></textarea>
      </div>

      <div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; border-top: 1px solid #E6EAF0; padding-top: 22px;">
        <a href="Board.dc.html" style="height: 56px; padding: 0 28px; display: inline-flex; align-items: center; border: 2px solid #C5CFDC; border-radius: 12px; background: #FFFFFF; color: #18212E; text-decoration: none; font-size: 20px; font-weight: 700;">취소</a>
        <button type="button" onClick="{{submit}}" style="height: 56px; padding: 0 32px; border: 0; border-radius: 12px; background: {{brand}}; color: #FFFFFF; font-family: inherit; font-size: 20px; font-weight: 700; cursor: pointer;">올리기</button>
      </div>
    </form>
  </main>

  <footer style="border-top: 1px solid #DDE3EB; background: #FFFFFF;">
    <div style="max-width: 1360px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 17px; color: #5B6779;">
      <span>행정누리 · [운영 기관명]</span>
      <span>시스템 문의 [연락처]</span>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"brand":{"editor":"color","default":"#1D4E89","options":["#1D4E89","#0F5C55","#3B3F8F","#22313F"]},"$preview":{"width":1440,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      brand: this.props.brand ?? '#1D4E89',
      done: !!(this.state && this.state.done),
      submit: () => this.setState({ done: true })
    };
  }
}
</script>
</body>
</html>
