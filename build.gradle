plugins {
    id 'java'
    // 전자정부 표준프레임워크 5.0과 같은 Spring Boot 버전
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'egovframework'
version = '0.1.0'

java {
    // 전자정부 표준프레임워크 5.0: JDK 17 이상
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// 전자정부 프레임워크 라이브러리 사용 여부: ./gradlew bootRun -PuseEgov
def useEgov = project.hasProperty('useEgov')
def egovVersion = project.findProperty('egovVersion') ?: '5.0.0'

repositories {
    mavenCentral()
    if (useEgov) {
        maven { url 'https://maven.egovframe.go.kr/maven/' }
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'
    // 음력 명절(설날·부처님 오신 날·추석) 계산용 한국 음력 달력
    implementation 'com.ibm.icu:icu4j:76.1'

    // 로컬 실행·테스트용 (Oracle 호환 모드)
    runtimeOnly 'com.h2database:h2'
    // 운영: Oracle
    runtimeOnly 'com.oracle.database.jdbc:ojdbc11'
    // 운영: Tibero — Maven Central에 없으므로 Tibero 설치 폴더의 tibero7-jdbc.jar 를 libs/ 에 넣는다
    runtimeOnly fileTree(dir: 'libs', include: ['*.jar'])

    if (useEgov) {
        // 아티팩트 이름과 버전은 전자정부 프레임워크 저장소에서 확인 후 조정
        implementation "org.egovframe.rte:org.egovframe.rte.fdl.cmmn:${egovVersion}"
        implementation "org.egovframe.rte:org.egovframe.rte.ptl.mvc:${egovVersion}"
    }

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
    // 테스트는 src/test/resources/application-local.yml (메모리 H2) 로 실행
    systemProperty 'spring.profiles.active', 'local'
}

// PC에서 gradlew bootRun 으로 실행하면 프로필을 정하지 않았을 때 local(H2 파일 DB)로 실행한다.
// 운영 서버는 jar 를 SPRING_PROFILES_ACTIVE=oracle 등으로 실행하며, 프로필이 없으면 시작하지 않는다.
tasks.named('bootRun') {
    if (!System.getenv('SPRING_PROFILES_ACTIVE') && !System.getProperty('spring.profiles.active')) {
        systemProperty 'spring.profiles.active', 'local'
    }
}
