# 운영은 HTTPS 로 한다: 세션 쿠키를 HTTPS 에서만 보낸다. 내부망에서 어쩔 수 없이 HTTP 로 시험할 때만 APP_COOKIE_SECURE=false.
server:
  # 앞단 프록시(TLS 종료)가 있으면 native 로 바꿔 X-Forwarded-Proto/For 를 믿는다
  forward-headers-strategy: ${APP_FORWARD_HEADERS:none}
  servlet:
    session:
      cookie:
        secure: ${APP_COOKIE_SECURE:true}

# Tibero 연결. 드라이버 jar(tibero7-jdbc.jar 등)를 프로젝트의 libs/ 폴더에 넣어야 한다.
# 접속 정보는 환경변수로 넘긴다.
#   DB_URL       예: jdbc:tibero:thin:@db-host:8629:DB_NAME
#   DB_USERNAME
#   DB_PASSWORD
#   DB_SCHEMA    테이블 주인 계정 (예: HJN_OWNER). 프로그램 계정과 같으면 비워 둔다.
# 테이블은 DBA가 db/oracle/schema.sql 로 미리 만든다 (Tibero는 Oracle 문법 호환).
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.tmax.tibero.jdbc.TbDriver
    hikari:
      # 프로그램 계정으로 접속해 테이블 주인의 스키마를 쓴다 (db/oracle/accounts_and_grants.sql)
      connection-init-sql: ALTER SESSION SET CURRENT_SCHEMA=${DB_SCHEMA:${DB_USERNAME}}
  sql:
    init:
      mode: never

  h2:
    console:
      enabled: false

app:
  # 운영에서는 접속 허용 네트워크를 반드시 실제 운영망으로 정한다. 정하지 않으면 이 서버 자신만 허용한다.
  #   예) APP_ALLOWED_NETWORKS=10.20.0.0/16,127.0.0.1/32
  access:
    allowed-networks: ${APP_ALLOWED_NETWORKS:127.0.0.1/32,::1/128}
  # 계정이 없을 때 APP_INIT_ADMIN_PASSWORD 가 없으면 시작하지 않는다 (무작위 비밀번호를 서버 로그에 남기지 않기 위해)
  init-admin:
    require-password: true
