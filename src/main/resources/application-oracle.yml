# Oracle 연결. 접속 정보는 환경변수로 넘긴다 (비밀번호를 파일에 적지 않는다).
#   DB_URL       예: jdbc:oracle:thin:@//db-host:1521/SERVICE_NAME
#   DB_USERNAME
#   DB_PASSWORD
# 테이블은 DBA가 db/oracle/schema.sql 로 미리 만든다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  sql:
    init:
      mode: never
