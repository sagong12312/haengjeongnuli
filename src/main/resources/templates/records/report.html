<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('기록물 생산현황')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('approval')}"></header>

<main class="page">
  <div th:replace="~{fragments/layout :: flash}"></div>
  <div class="page-head">
    <div><span class="crumb"><a th:href="@{/records}">기록물 등록대장</a> › 생산현황·이관 목록</span>
      <h1 th:text="${rep.year} + '년 기록물 생산현황'">생산현황</h1></div>
    <a class="btn btn-primary" th:href="@{/records/report.csv(year=${rep.year}, dept=${rep.dept})}">이관 목록 내려받기 (CSV)</a>
  </div>
  <p class="hint">처리과는 전년도(1월 1일~12월 31일)에 생산·접수를 마친 기록물의 생산현황을 다음 해 5월 31일까지 기록관에 통보합니다. 등록 취소한 기록물은 빠집니다.
    이관 목록은 기록관으로 넘길 때 쓰는 목록이며, 이관 시기는 기관의 기록관리 기준을 따르세요.</p>

  <form th:action="@{/records/report}" method="get" class="search-bar">
    <label for="ry" class="sr-only">연도</label>
    <select id="ry" name="year" class="select"><option th:each="y : ${years}" th:value="${y}" th:selected="${y == rep.year}" th:text="${y} + '년'">2025년</option></select>
    <th:block th:if="${loginUser.admin}">
      <label for="rd" class="sr-only">처리과</label>
      <select id="rd" name="dept" class="select"><option value="">전체 처리과</option>
        <option th:each="d : ${depts}" th:value="${d}" th:selected="${d == rep.dept}" th:text="${d}">부서</option></select>
    </th:block>
    <button type="submit" class="btn btn-outline">보기</button>
  </form>

  <div class="stats" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:12px;">
    <div class="stat"><span>처리과</span><strong th:text="${rep.dept} ?: '전체'">전체</strong></div>
    <div class="stat"><span>생산</span><strong th:text="${rep.produce} + '건'">0</strong></div>
    <div class="stat"><span>접수</span><strong th:text="${rep.receive} + '건'">0</strong></div>
    <div class="stat"><span>합계</span><strong th:text="${rep.produce + rep.receive} + '건'">0</strong></div>
  </div>

  <section class="panel flush" th:each="t : ${ {'기록물 형태', '보존기간', '공개 여부'} }"
           th:with="cs=${t == '기록물 형태'} ? ${rep.byMedium} : (${t == '보존기간'} ? ${rep.byRetention} : ${rep.byDisclosure})">
    <div class="panel-head"><h2 th:text="${t} + '별'">구분</h2></div>
    <p th:if="${#lists.isEmpty(cs)}" class="hint" style="padding:18px 22px;">기록물이 없습니다.</p>
    <div class="table-wrap" th:unless="${#lists.isEmpty(cs)}"><table class="list">
      <thead><tr><th scope="col" style="text-align:left" th:text="${t}">구분</th><th scope="col">생산</th><th scope="col">접수</th><th scope="col">합계</th></tr></thead>
      <tbody><tr th:each="c : ${cs}"><td class="left" th:text="${c.label}">항목</td><td th:text="${c.produce}">0</td><td th:text="${c.receive}">0</td>
        <td style="color:var(--text); font-weight:700" th:text="${c.total}">0</td></tr></tbody>
    </table></div>
  </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
