<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('한글 서식함')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('home')}"></header>

<main class="page">
  <div th:replace="~{fragments/layout :: flash}"></div>
  <div><span class="crumb"><a th:href="@{/}">홈</a> › 한글 서식함</span><h1>한글 서식함</h1></div>
  <p class="hint">기관에서 쓰는 한글 서식을 내려받거나, 민원·영업소·건축·직원 정보를 서식의 누름틀에 채워 한글 파일로 만듭니다.
    <span th:if="${source}" th:text="'지금 고른 자료로 채웁니다 (' + (${source == 'civil'} ? '민원' : (${source == 'hygiene'} ? '영업소' : (${source == 'building'} ? '건축' : '직원 정보'))) + ').'">자료</span>
    가족관계·기본증명서, 주민등록 등·초본 같은 법정 증명서는 해당 전산 시스템에서만 발급하므로 여기서는 채워 만들 수 없습니다.</p>
  <p th:if="${#lists.isEmpty(forms)}" class="panel hint">올라온 서식이 없습니다. 관리자가 <b>시스템 관리 › 한글 서식</b>에서 올립니다.</p>

  <th:block th:each="cat : ${categories}"><th:block th:with="list=${forms.?[category == '__${cat}__']}">
  <section class="panel flush" th:if="${!#lists.isEmpty(list)}">
    <div class="panel-head"><h2 th:text="${cat}">민원</h2></div>
    <div class="table-wrap"><table class="list">
      <thead><tr><th scope="col" style="text-align:left">서식</th><th scope="col">누름틀</th><th scope="col">내려받기</th><th scope="col">채워 만들기</th></tr></thead>
      <tbody><tr th:each="f : ${list}">
        <td class="left"><b th:text="${f.name}">서식</b><small class="muted" style="display:block" th:text="${f.originalName}">파일</small></td>
        <td th:text="${#lists.isEmpty(f.fieldList)} ? '없음' : ${#lists.size(f.fieldList)} + '개'">0개</td>
        <td><a th:href="@{/forms/{id}/file(id=${f.formId})}">내려받기</a>
          <a th:if="${@hwpViewer.supports(f.originalName)}" th:href="@{/forms/{id}/view(id=${f.formId})}"> · 보기</a></td>
        <td><a th:if="${f.fillable}" class="btn btn-outline btn-sm" th:href="@{/forms/{id}/fill(id=${f.formId}, source=${source}, sourceId=${sourceId})}">채워 만들기</a>
          <span th:unless="${f.fillable}" class="muted" th:text="${f.fillableYn == 'N'} ? '법정 증명서' : '누름틀 없음'">—</span></td>
      </tr></tbody>
    </table></div>
  </section>
  </th:block></th:block>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
