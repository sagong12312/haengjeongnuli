<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('민원 답변 문구')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('work')}"></header>
<main class="page">
  <div th:replace="~{fragments/layout :: flash}"></div>
  <div><span class="crumb"><a th:href="@{/desk}">내 업무</a> › 민원 답변 문구</span><h1>민원 답변 문구</h1></div>
  <p class="hint">자주 쓰는 답변을 저장해 두면 민원 처리 화면의 '답변 문구 넣기'에서 골라 넣을 수 있습니다. 넣은 뒤 민원에 맞게 고쳐 쓰세요.</p>
  <form class="panel" th:action="@{/desk/templates}" method="post" style="gap:10px;">
    <h2>새 문구</h2>
    <div class="field"><label for="tt">문구 이름</label><input id="tt" name="title" class="input" maxlength="100" required placeholder="예: 불법주정차 단속 안내"></div>
    <div class="field"><label for="tb">문구</label><textarea id="tb" name="body" class="textarea" rows="5" maxlength="1300" required></textarea></div>
    <label class="check" th:unless="${#strings.isEmpty(myDept)}"><input type="checkbox" name="shared" value="true"><span th:text="${myDept} + ' 공용으로 둡니다'">부서 공용</span></label>
    <div class="form-actions" style="justify-content:flex-end;"><button type="submit" class="btn btn-primary">저장</button></div>
  </form>
  <section class="panel flush">
    <div class="panel-head"><h2>저장한 문구</h2><span class="muted" th:text="${#lists.size(templates)} + '개'">0개</span></div>
    <p th:if="${#lists.isEmpty(templates)}" class="hint" style="padding:0 24px 20px;">저장한 문구가 없습니다.</p>
    <div th:each="t : ${templates}" style="padding:16px 24px; border-top:1px solid var(--line-2); display:flex; flex-direction:column; gap:6px;">
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;"><b th:text="${t['title']}">이름</b>
        <span class="badge" th:classappend="${t['ownerId'] == null} ? 'badge-blue' : 'badge-gray'" th:text="${t['ownerId'] == null} ? '부서 공용' : '내 문구'">구분</span>
        <form th:action="@{/desk/templates/{id}/delete(id=${t['id']})}" method="post" class="inline-form" style="margin-left:auto;"><button type="submit" class="btn btn-outline btn-sm">지우기</button></form></div>
      <div style="white-space:pre-wrap; color:var(--text-2);" th:text="${t['body']}">문구</div>
    </div>
  </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
