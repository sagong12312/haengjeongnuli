<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('근태 정정 신청')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('hr')}"></header>
<main class="page narrow">
  <div th:replace="~{fragments/layout :: flash}"></div>
  <div><span class="crumb"><a th:href="@{/hr}">인사</a> › 근태 정정 신청</span><h1>근태 정정 신청</h1></div>
  <p class="hint">출근·퇴근 버튼을 누르지 못했거나 잘못 눌렀을 때 결재를 받아 고칩니다. 승인되면 근무상황과 시간외근무 계산에 반영됩니다.
    고치지 않을 칸은 비워 두세요. 60일 안의 기록만 신청할 수 있습니다.</p>
  <form class="panel" th:action="@{/hr/fix}" method="post" style="gap:16px;">
    <div class="grid-fields">
      <div class="field"><label for="fdate">날짜 <span class="req">*</span></label>
        <input id="fdate" name="date" type="date" class="input" required th:value="${date}" th:max="${today}"></div>
      <div class="field"><label for="fin">출근 시각</label><input id="fin" name="inTime" type="time" class="input"></div>
      <div class="field"><label for="fout">퇴근 시각</label><input id="fout" name="outTime" type="time" class="input"></div>
    </div>
    <label class="check"><input type="checkbox" name="outNextDay" value="true">퇴근이 자정을 넘겨 다음 날이었습니다</label>
    <div class="field"><label for="freason">사유 <span class="req">*</span></label>
      <textarea id="freason" name="reason" class="textarea" rows="3" maxlength="500" required placeholder="예: 현장 점검 뒤 바로 퇴근해 퇴근 버튼을 누르지 못함"></textarea></div>
    <div class="field"><label for="fappr">결재권자 <span class="req">*</span></label>
      <select id="fappr" name="approver" class="select" required>
        <option value="">선택</option>
        <option th:each="u : ${approvers}" th:value="${u.loginId}" th:text="${u.userName} + ' ' + ${u.position()} + (${u.deptName} ? ' · ' + ${u.deptName} : '')">직원</option>
      </select></div>
    <div class="form-actions"><a class="btn btn-plain btn-lg" th:href="@{/hr/sheet}">취소</a>
      <button type="submit" class="btn btn-primary btn-lg">결재 올리기</button></div>
  </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
