<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('출장 복명·정산')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('hr')}"></header>
<main class="page">
  <div th:replace="~{fragments/layout :: flash}"></div>
  <div><span class="crumb"><a th:href="@{/hr}">인사</a> › 출장 복명·정산</span><h1>출장 복명·정산</h1></div>
  <p class="hint">승인된 출장을 다녀오면 결과(복명)를 적고, 관외 출장은 실제 운임·숙박비로 여비를 정산합니다. <a th:href="@{/hr/duty/new(kind='TRIP')}">새 출장 신청</a></p>
  <section class="panel flush">
    <p th:if="${#lists.isEmpty(trips)}" class="hint" style="padding:18px 22px;">출장 신청이 없습니다.</p>
    <div class="table-wrap" th:unless="${#lists.isEmpty(trips)}">
      <table class="list" style="min-width:860px">
        <thead><tr><th scope="col">기간</th><th scope="col">구분</th><th scope="col" style="text-align:left">출장지</th><th scope="col">결재</th>
          <th scope="col">어림 여비</th><th scope="col">정산 여비</th><th scope="col">복명·정산</th></tr></thead>
        <tbody>
          <tr th:each="t : ${trips}">
            <td th:text="${t.startDate == t.endDate} ? ${t.startDate} : ${t.startDate} + ' ~ ' + ${t.endDate}">기간</td>
            <td th:text="${t.tripAreaLabel}">관외</td>
            <td class="left" th:text="${t.destination}">출장지</td>
            <td><span th:class="'badge ' + ${t.statusBadge}" th:text="${t.statusLabel}">승인</span></td>
            <td th:text="${t.estAmount} != null ? ${#numbers.formatInteger(t.estAmount, 0, 'COMMA')} + '원' : '—'">0원</td>
            <td th:text="${t.settledAmount} != null ? ${#numbers.formatInteger(t.settledAmount, 0, 'COMMA')} + '원' : '—'">—</td>
            <td><a th:href="@{/hr/trips/{id}(id=${t.reqId})}"
                   th:text="${t.settledAmount} != null ? '보기' : (${t.docStatus == 'DONE' and !t.endDate.isAfter(today)} ? '복명·정산하기' : '보기')">보기</a></td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
