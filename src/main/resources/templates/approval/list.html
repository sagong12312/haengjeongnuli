<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('전자결재')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('approval')}"></header>

<main class="page">
  <div th:replace="~{fragments/layout :: flash}"></div>

  <div class="page-head">
    <div>
      <span class="crumb"><a th:href="@{/}">홈</a> › 전자결재 › <span th:text="${current.label}">결재 대기</span></span>
      <h1>전자결재</h1>
    </div>
    <a class="btn btn-primary" th:href="@{/approval/draft}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      기안하기
    </a>
  </div>

  <!-- 문서함 -->
  <nav aria-label="문서함" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:14px;">
    <a th:each="b : ${boxes}" th:href="@{/approval(box=${b.id})}"
       th:attr="aria-current=${b.id == current.id} ? 'page' : null"
       th:style="${b.id == current.id} ? 'border:3px solid var(--brand); box-shadow:0 2px 8px rgba(24,33,46,0.08);' : 'border:1px solid var(--line); padding:20px 22px;'"
       style="background:#fff; border-radius:14px; padding:18px 20px; display:flex; flex-direction:column; gap:4px; text-decoration:none; color:var(--text);">
      <span style="font-size:19px; font-weight:700;" th:text="${b.label}">결재 대기</span>
      <span style="font-size:32px; font-weight:800;">0</span>
      <span style="font-size:16px; color:var(--text-3);" th:text="${b.desc}">내가 결재할 문서</span>
    </a>
  </nav>

  <form class="search-bar" role="search" th:action="@{/approval}" method="get">
    <input type="hidden" name="box" th:value="${current.id}">
    <label for="aperiod" class="sr-only">기간</label>
    <select id="aperiod" name="period" class="select"><option>최근 1개월</option><option>최근 3개월</option><option>올해</option><option>전체</option></select>
    <label for="aq" class="sr-only">문서 검색</label>
    <input id="aq" name="q" class="input" type="search" placeholder="제목, 문서번호, 기안자 검색">
    <button type="submit" class="btn btn-outline">검색</button>
  </form>

  <section class="panel flush" aria-label="결재 문서 목록">
    <div class="panel-head">
      <h2 th:text="${current.label}">결재 대기</h2>
      <span style="font-size:17px; color:var(--text-2);">전체 <b style="color:var(--text)">[건수]</b>건</span>
    </div>
    <div class="table-wrap">
      <table class="list" style="min-width:900px">
        <thead><tr>
          <th scope="col" style="width:150px">문서번호</th><th scope="col" style="text-align:left">제목</th>
          <th scope="col" style="width:120px">기안자</th><th scope="col" style="width:140px">기안부서</th>
          <th scope="col" style="width:120px">기안일</th><th scope="col" style="width:120px">상태</th>
        </tr></thead>
        <tbody>
          <tr th:each="i : ${#numbers.sequence(1,6)}">
            <td>[문서번호]</td><td class="left"><a href="#">[문서 제목]</a></td><td>[기안자]</td><td>[부서]</td><td>[날짜]</td>
            <td><span th:class="'badge ' + ${current.badge}" th:text="${current.status}">결재 대기</span></td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

  <nav class="pager" aria-label="페이지">
    <a href="#" aria-label="이전 페이지">‹</a><a href="#" aria-current="page">1</a><a href="#">2</a><a href="#" aria-label="다음 페이지">›</a>
  </nav>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
