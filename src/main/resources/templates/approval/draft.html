<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('기안하기')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('approval')}"></header>

<main class="page narrow">
  <div>
    <span class="crumb"><a th:href="@{/approval}">전자결재</a> › <span th:text="${doc} ? '임시저장 문서' : '기안하기'">기안하기</span></span>
    <h1 th:text="${doc} ? '임시저장 문서 고치기' : '기안하기'">기안하기</h1>
  </div>
  <div th:replace="~{fragments/layout :: flash}"></div>

  <form th:action="${doc} ? @{/approval/{id}/edit(id=${doc.docId})} : @{/approval/draft}" th:object="${approvalForm}"
        method="post" enctype="multipart/form-data" style="display:flex; flex-direction:column; gap:20px;">
    <div th:replace="~{fragments/form-errors :: errors}"></div>

    <!-- 결재선 -->
    <section class="panel" aria-labelledby="line-title">
      <div style="display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px;">
        <h2 id="line-title">결재선</h2>
        <button type="button" id="add-approver" class="btn btn-outline" style="height:48px; font-size:18px;">+ 검토자 추가</button>
      </div>
      <ol id="line" style="list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; align-items:stretch; gap:10px;">
        <li class="step"><div class="step-box"><div class="step-role">기안</div><div class="step-body"><b th:text="${loginUser.name()}">[사용자명]</b><small th:text="${loginUser.dept()}">[소속 부서]</small></div></div></li>
        <li class="step reviewer" th:each="i : ${#numbers.sequence(0, maxReviewers - 1)}"
            th:with="sel=${approvalForm.reviewers.size() > i} ? ${approvalForm.reviewers[i]} : ''">
          <div class="step-box">
            <label class="step-role" th:for="'rv' + ${i}" th:text="'검토 ' + ${i + 1}">검토</label>
            <div class="step-body">
              <select th:id="'rv' + ${i}" name="reviewers" class="select approver-select">
                <option value="">(없음)</option>
                <option th:each="c : ${candidates}" th:value="${c.loginId}" th:selected="${c.loginId == sel}"
                        th:text="${c.userName} + ' ' + ${c.position()} + (${c.deptName} ? ' · ' + ${c.deptName} : '')">직원</option>
              </select>
            </div>
          </div>
        </li>
        <li class="step"><div class="step-box">
          <label class="step-role" for="final">결재 <span class="req">*</span></label>
          <div class="step-body">
            <select id="final" th:field="*{finalApprover}" class="select approver-select">
              <option value="">결재권자 선택</option>
              <option th:each="c : ${candidates}" th:value="${c.loginId}"
                      th:text="${c.userName} + ' ' + ${c.position()} + (${c.deptName} ? ' · ' + ${c.deptName} : '')">직원</option>
            </select>
          </div>
        </div></li>
      </ol>
      <p class="hint" th:text="'검토자는 차례대로 ' + ${maxReviewers} + '명까지 둘 수 있고, 마지막에 결재권자가 결재합니다. 결재할 차례가 된 사람에게 알림이 갑니다.'">안내</p>
    </section>

    <section class="panel" style="padding:28px; gap:22px;">
      <div class="grid-fields" style="grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));">
        <div class="field">
          <label for="dkind">문서 종류</label>
          <select id="dkind" th:field="*{kind}" class="select"><option th:each="k : ${kinds}" th:value="${k}" th:text="${k}">일반 기안</option></select>
        </div>
        <div class="field">
          <label for="dkeep">보존기간</label>
          <select id="dkeep" th:field="*{retention}" class="select"><option th:each="k : ${retentions}" th:value="${k}" th:text="${k}">1년</option></select>
        </div>
        <div class="field">
          <label for="dopen">공개 여부</label>
          <select id="dopen" th:field="*{disclosure}" class="select"><option th:each="k : ${disclosures}" th:value="${k}" th:text="${k}">공개</option></select>
        </div>
        <div class="field">
          <label for="ddate">시행일자</label>
          <input id="ddate" th:field="*{effectiveDate}" type="date" class="input">
        </div>
      </div>

      <!-- 비공개 사유: 부분공개·비공개일 때 -->
      <fieldset id="restrict" th:hidden="${approvalForm.disclosure == '공개'}" style="margin:0; border:2px solid var(--orange-line); background:#FFF8F0; border-radius:12px; padding:18px 20px; display:flex; flex-direction:column; gap:12px;">
        <legend style="padding:0 6px; font-size:19px; font-weight:700; color:var(--orange-fg);">비공개 사유 (정보공개법 제9조 제1항, 하나 이상 선택) <span class="req">*</span></legend>
        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:8px 16px;">
          <label class="check" th:each="r : ${ {'1|제1호 법령상 비밀·비공개','2|제2호 국가안전보장·국방·통일·외교','3|제3호 국민의 생명·신체·재산 및 공공안전','4|제4호 재판·수사 등','5|제5호 업무의 공정한 수행에 현저한 지장','6|제6호 개인정보 (사생활 침해 우려)','7|제7호 법인 등의 경영·영업상 비밀','8|제8호 부동산 투기·매점매석 등 특정인 이익·불이익 우려'} }"
                 th:with="v=${#strings.substringBefore(r,'|')}">
            <input type="checkbox" name="reason" th:value="${v}" th:checked="${approvalForm.reason != null and approvalForm.reason.contains(v)}"><span th:text="${#strings.substringAfter(r,'|')}">사유</span>
          </label>
        </div>
        <div class="field">
          <label for="dreason" style="font-size:18px;">제한 범위·사유</label>
          <input id="dreason" th:field="*{reasonDetail}" class="input" type="text" maxlength="500" placeholder="비공개하는 부분과 사유를 적으세요 (예: 붙임 2 개인정보 포함)">
        </div>
      </fieldset>

      <!-- 두문: 수신 · 경유 · 참조 -->
      <div class="grid-fields">
        <div class="field">
          <label for="drecvtype">수신 구분</label>
          <select id="drecvtype" th:field="*{receiverType}" class="select"><option value="internal">내부결재</option><option value="external">수신자 지정</option></select>
        </div>
        <div class="field external" th:hidden="${approvalForm.receiverType != 'external'}">
          <label for="drecv">수신자 <span class="req">*</span></label>
          <input id="drecv" th:field="*{receiver}" class="input" type="text" maxlength="200" list="dept-list" placeholder="부서명 (예: 민원봉사과)">
        </div>
        <div class="field external" th:hidden="${approvalForm.receiverType != 'external'}">
          <label for="dvia">경유</label>
          <input id="dvia" th:field="*{via}" class="input" type="text" maxlength="200" placeholder="경유할 기관이 있을 때">
        </div>
        <div class="field external" th:hidden="${approvalForm.receiverType != 'external'}">
          <label for="dref">참조</label>
          <input id="dref" th:field="*{reference}" class="input" type="text" maxlength="200" placeholder="참조할 부서·담당자">
        </div>
      </div>
      <datalist id="dept-list"><option th:each="d : ${candidates.![deptName]}" th:if="${d}" th:value="${d}"></option></datalist>
      <p class="hint external" th:hidden="${approvalForm.receiverType != 'external'}">수신자에 우리 시스템의 부서 이름을 그대로 적으면, 결재가 끝난 뒤 그 부서 직원의 '수신 문서'함에 들어가고 알림이 갑니다.</p>

      <div class="field">
        <label for="dtitle">제목 <span class="req">*</span></label>
        <input id="dtitle" th:field="*{title}" class="input" type="text" required maxlength="300" placeholder="문서 제목을 입력하세요">
      </div>
      <div class="field">
        <label for="dbody">본문 <span class="req">*</span></label>
        <textarea id="dbody" th:field="*{body}" class="textarea" rows="14" placeholder="본문을 입력하세요"></textarea>
      </div>
      <div class="field" th:if="${doc != null and !#lists.isEmpty(doc.files)}">
        <span style="font-weight:700;">지금 붙임 (지울 파일에 표시)</span>
        <label class="check" th:each="f : ${doc.files}"><input type="checkbox" name="removeFileIds" th:value="${f.fileId}"><span th:text="${f.originalName}">파일</span></label>
      </div>
      <div class="field">
        <label for="dfile">붙임</label>
        <input id="dfile" name="files" type="file" multiple class="input" style="height:auto; padding:12px; border-style:dashed; background:#F8FAFC;">
        <p class="hint" th:text="'올릴 수 있는 형식: ' + ${allowedExt}">형식</p>
      </div>
      <div class="field">
        <label for="dsender">발신 명의</label>
        <input id="dsender" th:field="*{sender}" class="input" type="text" maxlength="200" placeholder="[기관장 명의] — 내부결재는 비워 둡니다">
      </div>

      <div class="form-actions">
        <a class="btn btn-plain btn-lg" th:href="@{/approval}">취소</a>
        <div style="display:flex; flex-wrap:wrap; gap:10px;">
          <button type="submit" name="action" value="save" class="btn btn-outline btn-lg" formnovalidate>임시저장</button>
          <button type="submit" name="action" value="send" class="btn btn-primary btn-lg">결재 상신</button>
        </div>
      </div>
    </section>
  </form>

  <form th:if="${doc}" th:action="@{/approval/{id}/delete(id=${doc.docId})}" method="post" style="margin:0; display:flex; justify-content:flex-end;"
        onsubmit="return confirm('이 임시저장 문서를 지울까요?');">
    <button type="submit" class="btn btn-plain">임시저장 문서 지우기</button>
  </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<style>
  .step { display:flex; align-items:center; gap:10px; }
  .step + .step::before { content:'→'; color:#8A96A8; font-size:22px; }
  .step-box { min-width:170px; border:1px solid var(--line); border-radius:12px; overflow:hidden; text-align:center; }
  .step-role { display:block; background:var(--soft); padding:8px 12px; font-size:17px; font-weight:700; color:var(--text-2); }
  .step-body { padding:14px 12px; display:flex; flex-direction:column; gap:2px; }
  .step-body small { color:var(--text-3); font-size:16px; }
</style>
<script>
  (function () {
    var open = document.getElementById('dopen');
    var restrict = document.getElementById('restrict');
    open.addEventListener('change', function () { restrict.hidden = open.value === '공개'; });

    var recvType = document.getElementById('drecvtype');
    recvType.addEventListener('change', function () {
      var ext = recvType.value === 'external';
      document.querySelectorAll('.external').forEach(function (el) { el.hidden = !ext; });
    });

    // 비어 있는 검토 칸은 숨겨 두고 '검토자 추가'로 하나씩 연다
    var reviewers = Array.prototype.slice.call(document.querySelectorAll('.reviewer'));
    var btn = document.getElementById('add-approver');
    var shown = 0;
    reviewers.forEach(function (li, i) {
      var filled = li.querySelector('select').value !== '';
      if (filled) { shown = i + 1; }
    });
    function refresh() {
      reviewers.forEach(function (li, i) { li.hidden = i >= shown; });
      btn.disabled = shown >= reviewers.length;
    }
    btn.addEventListener('click', function () {
      if (shown < reviewers.length) { shown++; refresh(); reviewers[shown - 1].querySelector('select').focus(); }
    });
    refresh();
  })();
</script>
</body>
</html>
