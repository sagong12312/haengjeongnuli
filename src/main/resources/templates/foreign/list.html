<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('외국인주민')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('work')}"></header>
<main class="page">
  <div th:replace="~{fragments/layout :: flash}"></div>
  <div><span class="crumb"><a th:href="@{/}">홈</a> › 외국인주민</span><h1>외국인주민 지원</h1></div>
  <p class="hint" th:text="'통역·한국어 교육·생활 상담 등 지원 기록입니다. 본인 동의를 받은 경우에만 올리고, 외국인등록번호는 받지 않습니다. 지원 대장은 ' + ${depts} + ' 직원만 열 수 있고, 지원을 마치면 ' + ${keepDays} + '일 뒤(동의 철회는 바로) 파기됩니다.'">안내</p>

  <section class="panel flush">
    <div class="panel-head"><h2>국적별 지원 현황</h2><span class="muted">숫자만 보여 줍니다</span></div>
    <p th:if="${#lists.isEmpty(stats)}" class="hint" style="padding:18px 22px;">지원 중인 주민이 없습니다.</p>
    <div class="table-wrap" th:unless="${#lists.isEmpty(stats)}"><table class="list">
      <thead><tr><th scope="col">국적</th><th scope="col">지원 중인 주민</th><th scope="col">올해 지원 건수</th></tr></thead>
      <tbody><tr th:each="s : ${stats}"><td th:text="${s['nationality']}">국적</td>
        <td th:text="${s['people']} < 5 ? '5명 미만' : ${s['people']} + '명'">명</td><td th:text="${s['supports']} + '건'">건</td></tr></tbody>
    </table></div>
  </section>

  <th:block th:if="${access}">
  <form th:action="@{/foreign}" method="get" class="search-bar">
    <label for="fa" class="sr-only">구분</label>
    <select id="fa" name="active" class="select"><option value="true" th:selected="${active}">지원 중</option><option value="false" th:selected="${!active}">지원 종료</option></select>
    <label for="fn" class="sr-only">국적</label>
    <select id="fn" name="nationality" class="select"><option value="">전체 국적</option><option th:each="n : ${nationalities}" th:value="${n}" th:text="${n}" th:selected="${n == nationality}">국적</option></select>
    <label for="fq" class="sr-only">이름</label><input id="fq" name="q" class="input" th:value="${q}" placeholder="이름" maxlength="50">
    <button type="submit" class="btn btn-outline">보기</button>
  </form>
  <section class="panel flush">
    <div class="panel-head"><h2 th:text="${active} ? '지원 중' : '지원 종료 (파기 예정)'">지원</h2><span class="muted" th:text="${#lists.size(rows)} + '명'">0명</span></div>
    <p th:if="${#lists.isEmpty(rows)}" class="hint" style="padding:18px 22px;">기록이 없습니다.</p>
    <div class="table-wrap" th:unless="${#lists.isEmpty(rows)}"><table class="list">
      <thead><tr><th scope="col">이름</th><th scope="col">국적</th><th scope="col">사용 언어</th><th scope="col">지원</th><th scope="col">동의일</th><th scope="col" th:unless="${active}">파기 예정</th></tr></thead>
      <tbody><tr th:each="r : ${rows}">
        <td><a th:href="@{/foreign/{id}(id=${r.resId})}" th:text="${r.name}">이름</a></td><td th:text="${r.nationality}">국적</td>
        <td th:text="${r.language} ?: '—'">언어</td><td th:text="${r.supportCount} + '건'">건</td><td th:text="${r.consentOn}">날짜</td>
        <td th:unless="${active}" th:text="${r.purgeAfter}">날짜</td>
      </tr></tbody>
    </table></div>
    <form th:unless="${active}" th:action="@{/foreign/purge}" method="post" style="padding:12px 22px;" data-confirm="보유기간이 지난 정보를 지금 파기할까요? 되돌릴 수 없습니다.">
      <button type="submit" class="btn btn-plain btn-sm">보유기간 지난 정보 지금 파기 (매일 새벽 자동)</button></form>
  </section>
  <form class="panel" th:action="@{/foreign}" method="post" style="gap:12px;">
    <h2>지원 대상 올리기</h2>
    <div class="grid-fields" style="grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));">
      <div class="field"><label for="rn">이름 <span class="req">*</span></label><input id="rn" name="name" class="input" required maxlength="100"></div>
      <div class="field"><label for="rt">국적 <span class="req">*</span></label><input id="rt" name="nationality" class="input" required maxlength="50"></div>
      <div class="field"><label for="rb">생년월일 <span class="req">*</span></label><input id="rb" name="birthDate" type="date" class="input" required th:max="${today}"></div>
      <div class="field"><label for="rl">사용 언어</label><input id="rl" name="language" class="input" maxlength="50"></div>
      <div class="field"><label for="rs">체류자격</label><input id="rs" name="stayStatus" class="input" maxlength="20" placeholder="예: E-9, F-6"></div>
      <div class="field"><label for="rp">연락처</label><input id="rp" name="phone" class="input" maxlength="20"></div>
      <div class="field"><label for="rc">동의받은 날 <span class="req">*</span></label><input id="rc" name="consentOn" type="date" class="input" required th:value="${today}" th:max="${today}"></div>
    </div>
    <div class="field"><label for="ra">주소</label><input id="ra" name="address" class="input" maxlength="300"></div>
    <label class="check"><input type="checkbox" name="consent" value="true" required>개인정보 수집·이용 동의서(수집 항목·목적·보유기간·거부 권리 안내)를 받았습니다.</label>
    <div class="form-actions" style="justify-content:flex-end;"><button type="submit" class="btn btn-primary">올리기</button></div>
  </form>
  </th:block>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
