<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('계약대장')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('finance')}"></header>

<main class="page">
  <div th:replace="~{fragments/layout :: flash}"></div>
  <div><span class="crumb"><a th:href="@{/finance}">재정·세무</a> › 계약대장</span><h1 th:text="${year} + '년 계약대장'">계약대장</h1></div>
  <p class="hint">체결한 공사·물품·용역 계약을 등록하고 완료·해지를 기록합니다. 대금은 전자결재 '지출결의'로 지급합니다.
    수의계약은 「지방자치단체를 당사자로 하는 계약에 관한 법률 시행령」 제25조의 해당 근거와 사유를 적어야 등록됩니다.</p>

  <form th:action="@{/finance/contracts}" method="get" class="search-bar">
    <label for="cy" class="sr-only">연도</label>
    <select id="cy" name="year" class="select"><option th:each="y : ${years}" th:value="${y}" th:selected="${y == year}" th:text="${y} + '년'">2026년</option></select>
    <th:block th:if="${seeAll}"><label for="cdp" class="sr-only">부서</label>
      <select id="cdp" name="dept" class="select"><option value="">전체 부서</option>
        <option th:each="d : ${@deptService.activeNames()}" th:value="${d}" th:selected="${d == scope}" th:text="${d}">부서</option></select></th:block>
    <button type="submit" class="btn btn-outline">보기</button>
    <a class="btn btn-plain" th:href="@{/finance/contracts.csv(year=${year}, dept=${scope})}">CSV 내려받기</a>
  </form>

  <section class="panel flush">
    <div class="panel-head"><h2>계약 목록</h2>
      <span class="muted" th:text="${#lists.size(rows)} + '건 · ' + ${#numbers.formatInteger(total, 1, 'COMMA')} + '원 (해지 제외)'">합계</span></div>
    <p th:if="${#lists.isEmpty(rows)}" class="hint" style="padding:18px 22px;">등록된 계약이 없습니다.</p>
    <div class="table-wrap" th:unless="${#lists.isEmpty(rows)}"><table class="list" style="min-width:1100px">
      <thead><tr><th scope="col">계약번호</th><th scope="col" style="text-align:left">계약명</th><th scope="col">종류·방법</th><th scope="col">상대자</th>
        <th scope="col">계약 금액</th><th scope="col">기간</th><th scope="col">부서</th><th scope="col">상태</th></tr></thead>
      <tbody><tr th:each="c : ${rows}">
        <td style="color:var(--text); font-weight:700" th:text="${c.contractNo}">번호</td>
        <td class="left"><span th:text="${c.title}">계약명</span>
          <small th:if="${c.privateReason}" class="muted" style="display:block" th:text="'수의계약 사유: ' + ${c.privateReason}">사유</small></td>
        <td th:text="${c.contractKind} + ' · ' + ${c.method}">종류</td>
        <td th:text="${c.party}">상대자</td>
        <td th:text="${#numbers.formatInteger(c.amount, 1, 'COMMA')} + '원'">금액</td>
        <td th:text="(${c.startDate} ?: ${c.contractDate}) + ' ~ ' + (${c.endDate} ?: '')">기간</td>
        <td th:text="${c.deptName}">부서</td>
        <td>
          <span th:class="'badge ' + (${c.overdue} ? 'badge-red' : (${c.status == 'ACTIVE'} ? 'badge-orange' : (${c.status == 'DONE'} ? 'badge-green' : 'badge-gray')))"
                th:text="${c.overdue} ? '기간 지남' : ${c.statusLabel}">상태</span>
          <small th:if="${c.statusNote}" style="display:block" th:text="${c.statusNote}">메모</small>
          <form th:if="${c.status == 'ACTIVE' and c.deptName == loginUser.dept()}" th:action="@{/finance/contracts/{id}/close(id=${c.contractId})}" method="post"
                style="display:flex; gap:4px; margin:6px 0 0; justify-content:center;">
            <label class="sr-only" th:for="'cs' + ${c.contractId}">처리</label>
            <select th:id="'cs' + ${c.contractId}" name="status" class="select" style="height:36px; font-size:14px; width:96px;">
              <option value="DONE">완료</option><option value="TERMINATED">해제·해지</option></select>
            <label class="sr-only" th:for="'cnn' + ${c.contractId}">사유</label>
            <input th:id="'cnn' + ${c.contractId}" name="note" class="input" placeholder="준공일·사유" style="height:36px; font-size:14px; width:110px;">
            <button type="submit" class="btn btn-plain btn-sm" style="height:36px;">기록</button>
          </form>
        </td>
      </tr></tbody>
    </table></div>
  </section>

  <form class="panel" th:action="@{/finance/contracts}" method="post" style="gap:16px;">
    <h2>계약 등록</h2>
    <div class="field"><label for="ct">계약명 <span class="req">*</span></label><input id="ct" name="title" class="input" required maxlength="300"></div>
    <div class="grid-fields" style="grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));">
      <div class="field"><label for="ck">종류</label><select id="ck" name="contractKind" class="select"><option th:each="k : ${kinds}" th:value="${k}" th:text="${k}">공사</option></select></div>
      <div class="field"><label for="cm">계약 방법</label><select id="cm" name="method" class="select"><option th:each="m : ${methods}" th:value="${m}" th:text="${m}">일반경쟁</option></select></div>
      <div class="field"><label for="cpt">계약 상대자 <span class="req">*</span></label><input id="cpt" name="party" class="input" required maxlength="200"></div>
      <div class="field"><label for="cbz">사업자등록번호</label><input id="cbz" name="partyBizNo" class="input" maxlength="12" placeholder="000-00-00000"></div>
      <div class="field"><label for="ca">계약 금액 <span class="req">*</span></label><input id="ca" name="amount" class="input" required inputmode="numeric" placeholder="예: 18,500,000"></div>
      <div class="field"><label for="cd">계약보증금</label><input id="cd" name="deposit" class="input" inputmode="numeric" placeholder="면제면 비움"></div>
      <div class="field"><label for="cdt">계약일 <span class="req">*</span></label><input id="cdt" name="contractDate" type="date" class="input" required th:value="${today}" th:max="${today}"></div>
      <div class="field"><label for="cs">착수일</label><input id="cs" name="startDate" type="date" class="input"></div>
      <div class="field"><label for="ce">준공·완료 예정일</label><input id="ce" name="endDate" type="date" class="input"></div>
      <div class="field"><label for="cb">관련 예산</label><select id="cb" name="budgetId" class="select"><option value="">(지정 안 함)</option>
        <option th:each="b : ${budgets}" th:value="${b.budgetId}" th:text="${b.code} + ' ' + (${b.detailName} ?: '') + ' · ' + ${#numbers.formatInteger(b.amount, 1, 'COMMA')} + '원'">예산</option></select></div>
    </div>
    <div class="field"><label for="cr">수의계약 근거·사유 (수의계약이면 필수)</label><input id="cr" name="privateReason" class="input" maxlength="500" placeholder="예: 시행령 제25조 해당 항·호와 그 사유"></div>
    <div class="form-actions" style="justify-content:flex-end;"><button type="submit" class="btn btn-primary btn-lg">계약 등록</button></div>
  </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
