<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('예산 보기')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('finance')}"></header>

<main class="page narrow" th:with="rev=${b.kind == 'REV'}">
  <div th:replace="~{fragments/layout :: flash}"></div>
  <div>
    <span class="crumb"><a th:href="@{/finance(area=${rev} ? 'rev' : 'fin',year=${b.fiscalYear})}">재정·세무</a> › 예산 보기</span>
    <h1 th:text="${rev} ? ${b.code} + ' ' + ${b.codeName} : ${b.detailName}">예산</h1>
  </div>

  <section class="panel" aria-labelledby="info-title">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
      <h2 id="info-title" th:text="${b.fiscalYear} + '년 ' + (${rev} ? '세입예산' : '세출예산')">예산</h2>
      <span th:class="'badge ' + ${b.statusBadge}" th:text="${b.statusLabel}">상태</span>
    </div>
    <dl class="kv">
      <th:block th:unless="${rev}">
        <div><dt>정책사업</dt><dd th:text="${b.policyName} + ' (' + ${b.policyType} + ', 기능 ' + ${b.funcCode} + ')'">정책</dd></div>
        <div><dt>단위사업</dt><dd th:text="${b.unitName}">단위</dd></div>
        <div><dt>세부사업</dt><dd th:text="${b.detailName}">세부</dd></div>
        <div><dt>통계목</dt><dd th:text="${b.code} + ' ' + ${b.codeName}">통계목</dd></div>
        <div><dt>소관 부서</dt><dd th:text="${b.deptName}">부서</dd></div>
      </th:block>
      <div th:if="${rev}"><dt>세입 과목</dt><dd th:text="${b.code} + ' ' + ${b.codeName}">목</dd></div>
      <div><dt>금액</dt><dd style="font-weight:700;" th:text="${amountText}">금액</dd></div>
      <div><dt>산출근거</dt><dd style="white-space:pre-wrap;" th:text="${b.basis} ?: '—'">산출근거</dd></div>
      <div><dt>작성·요청</dt><dd th:text="${b.requesterName} + (${b.requestedAt} ? ' · ' + ${#temporals.format(b.requestedAt, 'yyyy-MM-dd HH:mm')} + ' 요청' : '')">작성자</dd></div>
      <div th:if="${b.reviewedAt}"><dt th:text="${b.status == 'REJECTED'} ? '반려' : '승인'">승인</dt>
        <dd th:text="${b.reviewerName} + ' · ' + ${#temporals.format(b.reviewedAt, 'yyyy-MM-dd HH:mm')} + (${b.reviewNote} ? ' · ' + ${b.reviewNote} : '')">승인자</dd></div>
    </dl>
    <div style="display:flex; flex-wrap:wrap; gap:10px;" th:if="${canEdit}">
      <a class="btn btn-outline" th:href="@{/finance/budget/{id}/edit(id=${b.budgetId})}">고치기</a>
      <form th:action="@{/finance/budget/{id}/request(id=${b.budgetId})}" method="post" style="margin:0;"><button type="submit" class="btn btn-primary">승인 요청</button></form>
      <form th:action="@{/finance/budget/{id}/delete(id=${b.budgetId})}" method="post" style="margin:0;" onsubmit="return confirm('이 예산을 지울까요?');"><button type="submit" class="btn btn-plain">지우기</button></form>
    </div>
  </section>

  <section class="panel" th:if="${canReview}" aria-labelledby="rev-title" style="border:2px solid var(--brand);">
    <h2 id="rev-title">승인 검토</h2>
    <form th:action="@{/finance/budget/{id}/approve(id=${b.budgetId})}" method="post" style="display:flex; flex-direction:column; gap:12px; margin:0;">
      <div class="field"><label for="note">의견 <span class="muted" style="font-size:16px;">(반려할 때는 꼭 적습니다)</span></label>
        <textarea id="note" name="note" class="textarea" rows="3" maxlength="1000"></textarea></div>
      <div class="form-actions" style="justify-content:flex-end;">
        <button type="submit" class="btn btn-outline btn-lg" th:formaction="@{/finance/budget/{id}/reject(id=${b.budgetId})}"
                onclick="var n=document.getElementById('note'); if(!n.value.trim()){alert('반려 사유를 적어 주세요.'); n.focus(); return false;} return confirm('반려할까요?');">반려</button>
        <button type="submit" class="btn btn-primary btn-lg" th:formaction="@{/finance/budget/{id}/approve(id=${b.budgetId})}">승인</button>
      </div>
    </form>
  </section>

  <section class="panel" id="txns" th:unless="${rev}" aria-labelledby="txn-title" style="gap:16px;">
    <div style="display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px;">
      <h2 id="txn-title">집행</h2>
      <span th:if="${b.approved}" class="muted" th:text="'집행 ' + ${#numbers.formatInteger(b.used, 1, 'COMMA')} + '원 · 잔액 ' + ${#numbers.formatInteger(b.balance, 1, 'COMMA')} + '원 · 집행률 ' + ${b.rate} + '%'">잔액</span>
    </div>
    <p th:unless="${b.approved}" class="hint">승인된 예산만 집행할 수 있습니다.</p>
    <form th:if="${canExecute}" th:action="@{/finance/budget/{id}/execute(id=${b.budgetId})}" method="post" class="grid-fields"
          style="grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); align-items:end;">
      <div class="field"><label for="xdate">집행일 <span class="req">*</span></label><input id="xdate" name="date" type="date" class="input" required th:value="${today}"></div>
      <div class="field"><label for="xamount">금액(원) <span class="req">*</span></label><input id="xamount" name="amount" class="input" inputmode="numeric" required></div>
      <div class="field"><label for="xparty">지급처</label><input id="xparty" name="party" class="input" maxlength="200"></div>
      <div class="field"><label for="xdesc">내용 <span class="req">*</span></label><input id="xdesc" name="description" class="input" maxlength="500" required placeholder="예: 사무용품 구입"></div>
      <div class="field"><button type="submit" class="btn btn-primary">집행</button></div>
    </form>
    <p th:if="${#lists.isEmpty(txns)}" class="hint">집행 기록이 없습니다.</p>
    <div class="table-wrap" th:unless="${#lists.isEmpty(txns)}">
      <table class="list" style="min-width:720px">
        <thead><tr><th scope="col">집행일</th><th scope="col" style="text-align:right">금액</th><th scope="col">지급처</th>
          <th scope="col" style="text-align:left">내용</th><th scope="col">기록</th><th scope="col"></th></tr></thead>
        <tbody>
          <tr th:each="t : ${txns}" th:style="${t.cancelled} ? 'opacity:.55; text-decoration:line-through;' : null">
            <td th:text="${#temporals.format(t.txnDate, 'yyyy-MM-dd')}">날짜</td>
            <td class="right" th:text="${#numbers.formatInteger(t.amount, 1, 'COMMA')}">0</td>
            <td th:text="${t.party} ?: '—'">지급처</td>
            <td class="left" th:text="${t.description}">내용</td>
            <td th:text="${t.createdName}">기록</td>
            <td>
              <span th:if="${t.cancelled}" class="badge badge-gray">취소</span>
              <form th:if="${!t.cancelled and (t.createdBy == loginUser.loginId or isBudgetStaff)}" th:action="@{/finance/txn/{id}/cancel(id=${t.txnId})}" method="post" style="margin:0;"
                    onsubmit="return confirm('이 집행 기록을 취소할까요?');"><button type="submit" class="btn btn-plain" style="height:36px; font-size:15px; padding:0 10px;">취소</button></form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<style>
  .kv { margin:0; display:flex; flex-direction:column; }
  .kv div { display:flex; gap:16px; border-bottom:1px solid var(--line); padding:10px 0; }
  .kv dt { width:110px; flex:none; color:var(--text-3); font-weight:700; }
  .kv dd { margin:0; color:var(--text); }
</style>
</body>
</html>
