<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('예산 승인 대기')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('finance')}"></header>

<main class="page">
  <div th:replace="~{fragments/layout :: flash}"></div>
  <div>
    <span class="crumb"><a th:href="@{/finance(area=${kind == 'REV'} ? 'rev' : 'fin',year=${year})}">재정·세무</a> › 승인 대기</span>
    <h1 th:text="${year} + '년 ' + (${kind == 'REV'} ? '세입예산' : '세출예산') + ' 승인 대기'">승인 대기</h1>
  </div>
  <p class="hint" th:text="${budgetDept} + '에서 승인합니다. 자기가 요청한 예산은 다른 직원이 승인해야 합니다.'">안내</p>
  <section class="panel flush">
    <p th:if="${#lists.isEmpty(budgets)}" class="hint" style="padding:18px 22px;">승인을 기다리는 예산이 없습니다.</p>
    <div class="table-wrap" th:unless="${#lists.isEmpty(budgets)}">
      <table class="list" style="min-width:900px">
        <thead><tr>
          <th scope="col" style="text-align:left" th:text="${kind == 'REV'} ? '세입 과목' : '세부사업 / 통계목'">과목</th>
          <th scope="col">부서</th><th scope="col" style="text-align:right">금액</th><th scope="col">요청</th><th scope="col">요청일</th>
        </tr></thead>
        <tbody>
          <tr th:each="b : ${budgets}">
            <td class="left"><a th:href="@{/finance/budget/{id}(id=${b.budgetId})}"
                 th:text="${kind == 'REV'} ? ${b.code} + ' ' + ${b.codeName} : ${b.detailName} + ' / ' + ${b.code} + ' ' + ${b.codeName}">예산</a></td>
            <td th:text="${b.deptName} ?: '—'">부서</td>
            <td class="right" th:text="${#numbers.formatInteger(b.amount, 1, 'COMMA')}">0</td>
            <td th:text="${b.requesterName}">요청자</td>
            <td th:text="${b.requestedAt} ? ${#temporals.format(b.requestedAt, 'yyyy-MM-dd')} : '—'">날짜</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
