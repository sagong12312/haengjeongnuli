<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('부서 주간 업무 보고')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('work')}"></header>
<main class="page">
  <div><span class="crumb"><a th:href="@{/office}">공통 업무</a> › <a th:href="@{/office/weekly}">주간 업무 보고</a> › 부서 취합</span>
    <h1 th:text="${dept} + ' 주간 업무 보고 (' + ${week} + ' 주)'">부서 보고</h1></div>
  <nav style="display:flex; flex-wrap:wrap; gap:8px; align-items:center;" aria-label="주 바꾸기">
    <a class="btn btn-plain btn-sm" th:href="@{/office/weekly/dept(week=${prevWeek}, dept=${dept})}">‹ 지난주</a>
    <a th:if="${nextWeek}" class="btn btn-plain btn-sm" th:href="@{/office/weekly/dept(week=${nextWeek}, dept=${dept})}">다음 주 ›</a>
    <a class="btn btn-outline btn-sm" th:href="@{/office/weekly/dept.csv(week=${week}, dept=${dept})}">CSV 내려받기</a>
    <form th:if="${depts}" th:action="@{/office/weekly/dept}" method="get" class="search-bar" style="margin:0;">
      <input type="hidden" name="week" th:value="${week}">
      <label for="wdept" class="sr-only">부서</label>
      <select id="wdept" name="dept" class="select"><option th:each="d : ${depts}" th:value="${d}" th:text="${d}" th:selected="${d == dept}">부서</option></select>
      <button type="submit" class="btn btn-outline btn-sm">보기</button></form>
  </nav>
  <p th:unless="${#lists.isEmpty(missing)}" class="hint" th:text="'아직 안 쓴 직원: ' + ${#strings.listJoin(missing, ', ')}">미작성</p>
  <p th:if="${#lists.isEmpty(reports)}" class="hint">이 주에 쓴 보고가 없습니다.</p>
  <section class="panel" th:each="r : ${reports}" style="gap:8px;">
    <h2 th:text="${r['userName']}">이름</h2>
    <h3 style="margin:0; font-size:17px;">이번 주 한 일</h3><p style="margin:0; white-space:pre-wrap;" th:text="${r['done']}">한 일</p>
    <h3 style="margin:0; font-size:17px;">다음 주 할 일</h3><p style="margin:0; white-space:pre-wrap;" th:text="${r['plan']}">할 일</p>
    <th:block th:if="${r['issue']}"><h3 style="margin:0; font-size:17px;">건의·협조</h3><p style="margin:0; white-space:pre-wrap;" th:text="${r['issue']}">건의</p></th:block>
  </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
