<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('게시판')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('board')}"></header>

<main class="page">
  <div th:replace="~{fragments/layout :: flash}"></div>

  <div class="page-head">
    <div>
      <span class="crumb"><a th:href="@{/}">홈</a> › 게시판 › <span th:text="${current.label}">공지사항</span></span>
      <h1>게시판</h1>
    </div>
    <a th:if="${current.id != 'archive'}" class="btn btn-primary" th:href="@{/board/write}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      글쓰기
    </a>
    <a th:if="${current.id == 'archive'}" class="btn btn-primary" th:href="@{/board/upload}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      자료 올리기
    </a>
  </div>

  <nav class="tabs" aria-label="게시판 종류">
    <a th:each="t : ${tabs}" th:href="@{/board(tab=${t.id})}" th:text="${t.label}"
       th:attr="aria-current=${t.id == current.id} ? 'page' : null">공지사항</a>
  </nav>

  <form class="search-bar" role="search" th:action="@{/board}" method="get">
    <input type="hidden" name="tab" th:value="${current.id}">
    <label for="bq" class="sr-only">게시글 검색</label>
    <input id="bq" name="q" class="input" type="search" th:value="${q}" placeholder="제목 또는 작성자 검색">
    <button type="submit" class="btn btn-outline">검색</button>
  </form>

  <section class="panel flush" aria-label="게시글 목록">
    <div class="panel-head" style="font-size:17px; color:var(--text-2);">
      <span>전체 <b style="color:var(--text)" th:text="${total}">0</b>건</span><span>최신순 (최대 50건)</span>
    </div>
    <div class="table-wrap">
      <table class="list">
        <thead><tr>
          <th scope="col" style="width:80px">번호</th><th scope="col" style="text-align:left">제목</th>
          <th scope="col" style="width:130px">작성자</th><th scope="col" style="width:150px">부서</th>
          <th scope="col" style="width:130px">등록일</th><th scope="col" style="width:80px">조회</th>
        </tr></thead>
        <tbody>
          <tr th:if="${#lists.isEmpty(posts)}">
            <td colspan="6" style="padding:40px 12px;">등록된 글이 없습니다.</td>
          </tr>
          <tr th:each="p : ${posts}" th:classappend="${p.pinned} ? 'pinned'">
            <td>
              <span th:if="${p.pinned}" class="badge badge-brand">공지</span>
              <span th:unless="${p.pinned}" th:text="${p.postId}">1</span>
            </td>
            <td class="left">
              <span th:if="${p.category}" class="badge badge-gray" style="margin-right:6px;" th:text="${p.category}">업무 서식</span>
              <a href="#" th:text="${p.title}" th:style="${p.pinned} ? 'font-weight:700' : null">제목</a>
              <ul th:unless="${#lists.isEmpty(p.files)}" style="list-style:none; margin:8px 0 0; padding:0; display:flex; flex-direction:column; gap:4px;">
                <li th:each="f : ${p.files}">
                  <a th:href="@{/board/files/{id}(id=${f.fileId})}" style="display:inline-flex; align-items:center; gap:6px; font-size:16px; color:var(--brand);">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/></svg>
                    <span th:text="${f.originalName}">파일명</span>
                    <span class="muted" style="font-size:15px;" th:text="'(' + ${f.sizeText} + ' · 받은 횟수 ' + ${f.downloadCount} + ')'">(1.2MB)</span>
                  </a>
                </li>
              </ul>
            </td>
            <td th:text="${p.writer}">작성자</td>
            <td th:text="${p.writerDept} ?: '—'">부서</td>
            <td th:text="${#temporals.format(p.createdAt, 'yyyy-MM-dd')}">날짜</td>
            <td th:text="${p.viewCount}">0</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
