<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('공휴일 관리')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('admin')}"></header>

<main class="page narrow">
  <div th:replace="~{fragments/layout :: flash}"></div>
  <div>
    <span class="crumb"><a th:href="@{/}">홈</a> › <a th:href="@{/admin/users}">시스템 관리</a> › 공휴일</span>
    <h1>공휴일 관리</h1>
  </div>
  <p class="hint">민원 처리기한은 토요일과 공휴일을 빼고 계산합니다(민원처리법 제19조). 설날·추석·대체공휴일 등 「관공서의 공휴일에 관한 규정」의 공휴일은 자동으로 계산하고,
    <b>선거일과 정부가 지정하는 임시공휴일</b>만 여기에서 추가합니다. 일요일은 목록에 없지만 공휴일로 봅니다.</p>

  <section class="panel flush" aria-labelledby="hol-title">
    <div class="panel-head" style="flex-wrap:wrap; gap:10px;">
      <h2 id="hol-title" th:text="${year} + '년 공휴일'">공휴일</h2>
      <nav aria-label="연도 바꾸기" style="display:flex; gap:8px;">
        <a class="btn btn-plain" style="height:40px; font-size:16px; padding:0 12px;" th:href="@{/admin/holidays(year=${year - 1})}">‹ 이전 해</a>
        <a class="btn btn-plain" style="height:40px; font-size:16px; padding:0 12px;" th:href="@{/admin/holidays(year=${year + 1})}">다음 해 ›</a>
      </nav>
    </div>
    <div class="table-wrap">
      <table class="list" style="min-width:520px">
        <thead><tr><th scope="col">날짜</th><th scope="col" style="text-align:left">이름</th><th scope="col">구분</th><th scope="col">관리</th></tr></thead>
        <tbody>
          <tr th:each="h : ${holidays}">
            <td style="color:var(--text)" th:text="${#temporals.format(h.key, 'MM-dd')} + ' (' + ${'월화수목금토일'.substring(h.key.dayOfWeek.value - 1, h.key.dayOfWeek.value)} + ')'">날짜</td>
            <td class="left" th:text="${h.value}">이름</td>
            <td><span th:class="${extra.containsKey(h.key)} ? 'badge badge-orange' : 'badge badge-gray'" th:text="${extra.containsKey(h.key)} ? '직접 등록' : '규정'">규정</span></td>
            <td>
              <form th:if="${extra.containsKey(h.key)}" th:action="@{/admin/holidays/delete}" method="post" style="margin:0;"
                    data-confirm="이 공휴일을 지울까요?">
                <input type="hidden" name="day" th:value="${h.key}">
                <button type="submit" class="btn btn-plain" style="height:40px; font-size:16px; padding:0 12px;">지우기</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

  <form class="panel" th:action="@{/admin/holidays}" method="post" style="gap:16px;">
    <h2>선거일·임시공휴일 추가</h2>
    <div class="grid-fields">
      <div class="field"><label for="hday">날짜 <span class="req">*</span></label><input id="hday" name="day" type="date" class="input" required></div>
      <div class="field"><label for="hname">이름 <span class="req">*</span></label><input id="hname" name="name" type="text" class="input" required maxlength="100" placeholder="예: 제22대 국회의원선거"></div>
    </div>
    <div class="form-actions" style="justify-content:flex-end;"><button type="submit" class="btn btn-primary btn-lg">추가</button></div>
  </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
