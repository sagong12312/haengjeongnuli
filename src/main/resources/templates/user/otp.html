<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('2단계 인증')}"></head>
<body>
<main class="page" style="max-width:520px; margin:60px auto;">
  <h1>2단계 인증</h1>
  <p class="hint">휴대폰 인증 앱(Google Authenticator, Microsoft Authenticator 등)에 '행정누리'로 나온 6자리 번호를 넣으세요. 번호는 30초마다 바뀝니다.</p>
  <div th:if="${error}" class="alert alert-error" role="alert" th:text="${error}"></div>
  <form class="panel" th:action="@{/login/otp}" method="post" style="gap:12px;">
    <div class="field"><label for="otp">인증 번호 (6자리)</label>
      <input id="otp" name="code" class="input" inputmode="numeric" autocomplete="one-time-code" pattern="\d{6}" maxlength="6" required autofocus></div>
    <div class="form-actions"><button type="submit" class="btn btn-primary btn-lg">확인</button></div>
  </form>
  <form th:action="@{/logout}" method="post"><button type="submit" class="btn btn-plain">로그아웃</button></form>
  <p class="hint">휴대폰을 잃어버렸으면 시스템 관리자에게 본인 확인 뒤 2단계 인증 초기화를 요청하세요.</p>
</main>
</body>
</html>
