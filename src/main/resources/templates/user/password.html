<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('비밀번호 변경')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('')}"></header>

<main class="page" style="max-width:640px;">
  <div>
    <span class="crumb"><a th:href="@{/}">홈</a> › 내 정보</span>
    <h1>비밀번호 변경</h1>
  </div>

  <section class="panel" aria-labelledby="me-title" style="gap:8px;">
    <h2 id="me-title">내 정보</h2>
    <dl style="margin:0; display:grid; grid-template-columns:100px 1fr; gap:8px;">
      <dt class="muted">아이디</dt><dd style="margin:0" th:text="${loginUser.loginId}">admin</dd>
      <dt class="muted">이름</dt><dd style="margin:0" th:text="${loginUser.name()} + ' ' + ${loginUser.position()}">홍길동</dd>
      <dt class="muted">부서</dt><dd style="margin:0" th:text="${loginUser.dept()} ?: '—'">부서</dd>
      <dt class="muted">권한</dt><dd style="margin:0" th:text="${loginUser.role.label}">권한</dd>
    </dl>
  </section>

  <form class="panel" th:action="@{/mypage/password}" method="post" style="gap:20px;">
    <div th:if="${error}" class="alert" role="alert" style="background:var(--red-bg); border:1px solid #E8B4B4; color:var(--red-fg); font-size:17px;" th:text="${error}"></div>
    <div class="field">
      <label for="cur">현재 비밀번호</label>
      <input id="cur" name="currentPassword" class="input" type="password" required autocomplete="current-password">
    </div>
    <div class="field">
      <label for="np">새 비밀번호</label>
      <input id="np" name="newPassword" class="input" type="password" required minlength="9" maxlength="64" autocomplete="new-password">
      <p class="hint" th:text="${rule}">규칙</p>
    </div>
    <div class="field">
      <label for="cp">새 비밀번호 확인</label>
      <input id="cp" name="confirmPassword" class="input" type="password" required minlength="9" maxlength="64" autocomplete="new-password">
    </div>
    <div class="form-actions">
      <a class="btn btn-plain btn-lg" th:href="@{/}">취소</a>
      <button type="submit" class="btn btn-primary btn-lg">변경</button>
    </div>
  </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
