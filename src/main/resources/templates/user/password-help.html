<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('비밀번호 분실')}"></head>
<body style="min-height:100vh; display:flex; flex-direction:column;">
<main style="flex:1; display:flex; align-items:center; justify-content:center; padding:24px;">
  <div style="width:100%; max-width:480px; display:flex; flex-direction:column; gap:24px;">
    <form class="panel" th:action="@{/password-help}" method="post" style="padding:32px; gap:18px;">
      <h1 style="margin:0; font-size:26px;">비밀번호를 잊으셨나요?</h1>
      <div th:if="${info}" class="alert alert-success" role="status" style="font-size:17px;" th:text="${info}"></div>
      <p class="hint" style="margin:0;">아이디와 이름을 적어 요청하면 시스템 관리자가 본인을 확인한 뒤 임시 비밀번호를 직접(전화·대면) 알려 드립니다.
        임시 비밀번호로 로그인하면 바로 새 비밀번호로 바꿔야 합니다. 비밀번호를 5번 틀려 잠긴 경우도 같습니다.</p>
      <div class="field"><label for="hid">아이디</label><input id="hid" name="loginId" class="input" required maxlength="50" autocomplete="username"></div>
      <div class="field"><label for="hname">이름</label><input id="hname" name="userName" class="input" required maxlength="100"></div>
      <div class="field"><label for="hcontact">연락받을 곳 (선택)</label><input id="hcontact" name="contact" class="input" maxlength="100" placeholder="내선번호 등"></div>
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">요청하기</button>
      <p class="hint" style="text-align:center; margin:0;"><a th:href="@{/login}">로그인 화면으로</a></p>
    </form>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
