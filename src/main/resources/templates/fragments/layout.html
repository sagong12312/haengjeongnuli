<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' | 행정누리'">행정누리</title>
  <script th:src="@{/js/theme.js}"></script>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link th:if="${@globalModelAdvice.fontAvailable()}" rel="stylesheet" th:href="@{/css/font.css}" media="(min-width: 721px)">
  <script th:src="@{/js/app.js}" defer></script>
</head>
<body>

<header class="site-header" th:fragment="header(active)">
  <div th:if="${watermark}" class="watermark" aria-hidden="true" th:style="|background-image:url(&quot;${watermark}&quot;)|"></div>
  <div class="inner">
    <a class="logo" th:href="@{/}">
      <span class="logo-mark">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l9-6 9 6"/><path d="M5 10v9h14v-9"/><path d="M10 19v-5h4v5"/></svg>
      </span>
      <span><span class="logo-name">행정누리</span><span class="logo-sub">통합 행정업무 시스템</span></span>
    </a>
    <nav class="gnb" aria-label="주 메뉴">
      <a th:href="@{/}" th:attr="aria-current=${active == 'home'} ? 'page' : null">홈</a>
      <a th:href="@{/approval}" th:attr="aria-current=${active == 'approval'} ? 'page' : null">전자결재</a>
      <a th:href="@{/civil}" th:attr="aria-current=${active == 'civil'} ? 'page' : null">민원</a>
      <a th:href="@{/finance}" th:attr="aria-current=${active == 'finance'} ? 'page' : null">재정·세무</a>
      <a th:href="@{/hr}" th:attr="aria-current=${active == 'hr'} ? 'page' : null">인사</a>
      <a th:href="@{/board}" th:attr="aria-current=${active == 'board'} ? 'page' : null">게시판</a>
      <a th:if="${loginUser != null and loginUser.admin}" th:href="@{/admin/users}" th:attr="aria-current=${active == 'admin'} ? 'page' : null">시스템 관리</a>
    </nav>
    <div th:unless="${loginUser}"><button type="button" class="icon-btn theme-toggle" data-theme-toggle aria-label="화면 색 바꾸기">
        <svg class="ico-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ico-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <span data-theme-name>자동</span></button></div>
    <div th:if="${loginUser}" style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
      <a class="icon-btn" th:href="@{/notifications}" style="position:relative; text-decoration:none;"
         th:attr="aria-label=${unreadNotifications > 0} ? '알림 ' + ${unreadNotifications} + '건 읽지 않음' : '알림'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
        <span th:if="${unreadNotifications > 0}" aria-hidden="true"
              style="position:absolute; top:-6px; right:-6px; min-width:22px; height:22px; padding:0 6px; border-radius:999px; background:#D93636; color:#fff; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center;"
              th:text="${unreadNotifications > 99} ? '99+' : ${unreadNotifications}">3</span>
      </a>
      <a class="user-chip" th:href="@{/mypage/password}" style="color:#fff; text-decoration:none;" title="내 정보 · 비밀번호 변경">
        <span class="avatar" th:text="${loginUser.initial()}">홍</span>
        <span>
          <b th:text="${loginUser.name()} + ' ' + ${loginUser.position()}">홍길동 주무관</b>
          <small th:text="${#strings.isEmpty(loginUser.dept())} ? ${loginUser.role.label} : ${loginUser.dept()} + ' · ' + ${loginUser.role.label}">부서 · 권한</small>
        </span>
      </a>
      <button type="button" th:if="${sessionTimeoutSeconds > 0}" class="session-timer session-extend" th:attr="data-timeout=${sessionTimeoutSeconds}"
              th:data-ping="@{/session/ping}" th:data-expired="@{/login(error='timeout')}"
              title="아무것도 하지 않으면 자동으로 로그아웃됩니다. 누르면 시간을 처음으로 되돌립니다.">
        <small>로그아웃까지</small><b class="session-left">--:--</b><span class="sr-only">, 누르면 연장</span>
      </button>
      <button type="button" class="icon-btn theme-toggle" data-theme-toggle aria-label="화면 색 바꾸기">
        <svg class="ico-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ico-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <span data-theme-name>자동</span></button>
      <form th:action="@{/logout}" method="post" style="margin:0;">
        <button type="submit" class="icon-btn" style="width:auto; padding:0 14px; font:inherit; font-size:17px;">로그아웃</button>
      </form>
    </div>
  </div>
</header>

<div th:fragment="flash" th:if="${message}" class="alert alert-success" role="status" th:text="${message}"></div>

<footer class="site-footer" th:fragment="footer">
  <div class="inner">
    <span th:text="'행정누리 · ' + ${@orgService.get('orgName', '운영 기관명 미설정')}">행정누리</span>
    <span th:text="'시스템 문의 ' + ${@orgService.get('contact', '시스템 관리자')}">문의</span>
  </div>
</footer>

</body>
</html>
