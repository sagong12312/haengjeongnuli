# 로컬 실행: H2 파일 DB (Oracle 호환 모드). 프로젝트 폴더의 data/ 에 저장된다.
spring:
  datasource:
    url: jdbc:h2:file:./data/haengjeongnuli;MODE=Oracle;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/h2/schema.sql
  h2:
    console:
      # DB 내용을 직접 보는 관리 도구. 기본은 끔. 필요할 때만 H2_CONSOLE_ENABLED=true 로 켜고 다 쓰면 끈다.
      # 켜도 시스템 관리자만, 허용 네트워크에서만 열린다.
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
      settings:
        web-allow-others: false
