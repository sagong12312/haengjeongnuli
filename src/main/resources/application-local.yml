# 로컬 실행: H2 파일 DB (Oracle 호환 모드). 프로젝트 폴더의 data/ 에 저장된다.
spring:
  datasource:
    url: jdbc:h2:file:./data/haengjeongnuli;MODE=Oracle;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/h2/schema.sql
  h2:
    console:
      enabled: true
      path: /h2-console
