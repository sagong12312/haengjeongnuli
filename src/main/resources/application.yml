server:
  port: 8080
  # 오류 화면에 내부 정보(스택 트레이스, 예외 이름·메시지, 검증 오류)를 내보내지 않는다
  error:
    include-stacktrace: never
    include-exception: false
    include-message: never
    include-binding-errors: never
    whitelabel:
      enabled: false
  servlet:
    session:
      timeout: 30m
      cookie:
        # 자바스크립트로 읽지 못하게, 다른 사이트에서 오는 요청에는 쿠키를 보내지 않게(SameSite=Lax)
        http-only: true
        same-site: lax
        # HTTPS 로 운영하면 APP_COOKIE_SECURE=true 로 켠다 (HTTP 에서 켜면 로그인이 안 된다)
        secure: ${APP_COOKIE_SECURE:false}
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: haengjeongnuli
  # 프로필(local / oracle / tibero)을 꼭 정해야 시작한다. 정하지 않으면 시작하지 않는다 (HaengjeongnuliApplication).
  #   PC에서 gradlew bootRun 으로 실행하면 local 로 정해진다 (build.gradle).
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB

mybatis:
  mapper-locations: classpath:egovframework/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: VARCHAR

app:
  # 접속을 허용할 네트워크 (쉼표로 구분, CIDR 표기). 기본값: 이 PC(127.0.0.1, ::1)만.
  # 다른 PC에서도 쓰려면 APP_ALLOWED_NETWORKS 로 정한다. 예: 127.0.0.1/32,::1/128,192.168.0.0/24
  access:
    allowed-networks: ${APP_ALLOWED_NETWORKS:127.0.0.1/32,::1/128}
  # 계정이 하나도 없을 때 만드는 첫 관리자(admin) 비밀번호. 비워 두면 무작위로 만들어 서버 창에 한 번 보여준다.
  init-admin:
    password: ${APP_INIT_ADMIN_PASSWORD:}
    # true 면 계정이 없을 때 APP_INIT_ADMIN_PASSWORD 가 없으면 시작하지 않는다 (운영 프로필에서 켠다)
    require-password: false
  password:
    # 비밀번호를 이 일수마다 바꾸게 한다
    max-age-days: 90
  finance:
    # 예산 승인을 맡는 부서 이름 (직원 계정의 부서와 같아야 한다)
    budget-dept: 예산편성과
  work:
    # 건축 인허가 대장을 고칠 수 있는 부서 (쉼표로 구분, 직원 계정의 부서 이름과 같아야 한다)
    building-depts: 건축과
    # 식품 영업소 대장·위생 점검을 고칠 수 있는 부서
    hygiene-depts: 위생과,식품위생과,환경위생과
  civil:
    # 처리기한이 며칠 이내로 남으면 '기한 임박'으로 볼지
    imminent-days: 2
  reminder:
    # 매일 아침 알림 시각 (초 분 시 일 월 요일). "-" 이면 끈다
    cron: "0 40 8 * * MON-FRI"
    # 처리기한이 이 시간 안에 끝나거나 지난 민원을 알린다
    civil-hours: 24
    # 상신한 지 이 날수가 지나도 결재 중인 문서를 지금 차례인 사람에게 알린다
    approval-days: 3
  login:
    # 비밀번호를 5번 틀리면 이 시간(분) 동안 잠기고 저절로 풀린다 (관리자는 바로 풀 수 있다)
    lock-minutes: 15
    # 한 접속 주소에서 ip-window-minutes 분 안에 ip-max-failures 번 틀리면 그 주소의 로그인을 잠시 막는다
    ip-max-failures: 20
    ip-window-minutes: 10
  audit:
    # 접속기록 점검 화면에서 '확인 필요'로 표시할 기간 내 건수
    download-alert: 100
    view-alert: 300
    login-fail-alert: 5
  file:
    # 첨부파일 저장 폴더 (운영에서는 백업되는 경로로 바꾼다)
    upload-dir: ./uploads
    # 올릴 수 있는 확장자
    allowed-extensions: hwp,hwpx,pdf,doc,docx,xls,xlsx,ppt,pptx,txt,csv,jpg,jpeg,png,gif,zip
    # 한 번에 올릴 수 있는 파일 수 (파일 내용도 확장자와 맞는지 확인한다)
    max-count: 10
