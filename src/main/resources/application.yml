server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: haengjeongnuli
  profiles:
    # 아무 프로필도 지정하지 않으면 local(H2) 로 실행
    default: local
  thymeleaf:
    cache: false

mybatis:
  mapper-locations: classpath:egovframework/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: VARCHAR

# 로그인 기능 전까지 쓰는 임시 사용자 정보
app:
  user:
    name: "[사용자명]"
    position: 주무관
    dept: "[소속 부서]"
    # COUNTER(창구 직원) 또는 GENERAL(일반 직원)
    role: COUNTER
  civil:
    # 처리기한이 며칠 이내로 남으면 '기한 임박'으로 볼지
    imminent-days: 2
