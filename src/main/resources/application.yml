server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: haengjeongnuli
  profiles:
    # 아무 프로필도 지정하지 않으면 local(H2) 로 실행
    default: local
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB

mybatis:
  mapper-locations: classpath:egovframework/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: VARCHAR

# 로그인 기능 전까지 쓰는 임시 사용자 정보
app:
  user:
    name: "[사용자명]"
    position: 주무관
    dept: "[소속 부서]"
    # COUNTER(창구 직원) 또는 GENERAL(일반 직원)
    role: COUNTER
  civil:
    # 처리기한이 며칠 이내로 남으면 '기한 임박'으로 볼지
    imminent-days: 2
  file:
    # 첨부파일 저장 폴더 (운영에서는 백업되는 경로로 바꾼다)
    upload-dir: ./uploads
    # 올릴 수 있는 확장자
    allowed-extensions: hwp,hwpx,pdf,doc,docx,xls,xlsx,ppt,pptx,txt,csv,jpg,jpeg,png,gif,zip
