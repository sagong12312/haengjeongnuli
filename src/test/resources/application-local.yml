# 테스트용: 파일 대신 메모리 H2 (Oracle 호환 모드)
spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=Oracle;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/h2/schema.sql
